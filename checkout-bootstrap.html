<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AgroFeira — fechar o pedido</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="agrofeira-bootstrap.css">
  <script defer src="validacao.js"></script>
</head>
<body>

  <main class="container py-4">
    <h1 class="h3 mb-4">Fechar o pedido</h1>

    <form class="row g-3 needs-validation" novalidate>

      <div class="col-12 col-md-6">
        <label class="form-label" for="nome">Nome completo</label>
        <input type="text" class="form-control" id="nome" name="nome" autocomplete="name" required aria-describedby="nome-erro">
        <div class="invalid-feedback" id="nome-erro">Informe o seu nome.</div>
      </div>

      <div class="col-12 col-md-6">
        <label class="form-label" for="email">E-mail</label>
        <input type="email" class="form-control" id="email" name="email" autocomplete="email" required aria-describedby="email-erro">
        <div class="invalid-feedback" id="email-erro">Informe um e-mail, como maria@exemplo.com.br.</div>
      </div>

      <div class="col-12">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="termos" name="termos" required aria-describedby="termos-erro">
          <label class="form-check-label" for="termos">Li e aceito as regras da feira</label>
          <div class="invalid-feedback" id="termos-erro">É preciso aceitar as regras para continuar.</div>
        </div>
      </div>

      <div class="col-12">
        <button type="submit" class="btn btn-primary">Fazer pedido</button>
      </div>

    </form>
  </main>

</body>
</html>
